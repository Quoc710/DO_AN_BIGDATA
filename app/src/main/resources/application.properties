# Khi chạy từ IDE: kết nối PostgreSQL trong Docker qua localhost.
# Khi chạy trong Docker (profile app), docker-compose ghi đè bằng biến SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5432/logdb
spring.datasource.username=loguser
spring.datasource.password=logpass
# JSON dùng snake_case: run_id, log_id, sent_ts...
spring.jackson.property-naming-strategy=SNAKE_CASE
# Còn lại để mặc định: Tomcat 200 threads, HikariCP pool 10 (đúng bảng tham số của nhóm)

# Chi dung cho /logs-batch: driver PostgreSQL gop cac lenh INSERT trong 1 lo thanh 1 lenh nhieu dong.
# Khong anh huong /logs (ghi tung dong).
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
# Cau hinh ghi theo lo: toi da 100 dong/lo, 4 luong ghi, hang doi 20000 log
batch.max-size=100
batch.writers=4
batch.queue-capacity=20000
