# Môi trường benchmark Log Analytics (tối ưu máy 8GB RAM, WSL2 giới hạn 5GB, 4 CPU)
#
# Nguyên tắc: dùng giá trị mặc định cho mọi tham số, chỉ khác mặc định ở 3 chỗ
# do máy chỉ có 8GB RAM (ghi rõ lý do vào báo cáo):
#   1. Giới hạn CPU/RAM từng container (mem_limit, cpus bên dưới)
#   2. WSL2 memory / processors = 5GB / 4  (cấu hình ở file %UserProfile%\.wslconfig, không nằm trong file này)
#   3. Heap của Kafka = 512MB (KAFKA_HEAP_OPTS bên dưới)
#
# Cách bật theo giai đoạn:
#   docker compose up -d                       -> chỉ PostgreSQL (làm baseline)
#   docker compose --profile streaming up -d   -> thêm Kafka, Elasticsearch, Spark, Redis
#   docker compose --profile app up -d --build -> thêm container Spring Boot (khi đã có ./app/Dockerfile)
#
# Lúc phát triển, bạn có thể chạy Spring Boot thẳng từ IDE và kết nối localhost.
name: log-analytics

services:
  # ---------- Baseline: PostgreSQL (luôn bật) ----------
  postgres:
    image: postgres:16-alpine
    container_name: la-postgres
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logdb
    ports:
      - "5432:5432"
    volumes:
      - ./init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    # shared_buffers = 128MB (bằng mặc định, ghi rõ để dễ tái lập)
    # max_connections không đặt -> mặc định 100
    command: ["postgres", "-c", "shared_buffers=128MB"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Kiến trúc đề xuất: Kafka (KRaft, không cần Zookeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: la-kafka
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Số partition mặc định cho topic tạo tự động = 1 (theo bảng tham số)
      KAFKA_NUM_PARTITIONS: 2
      # Khác mặc định (1GB): container chỉ có 1GB nên heap phải hạ xuống 512MB,
      # nếu không container bị hệ thống kill vì thiếu RAM
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      start_period: 2m
      retries: 10

  # ---------- Elasticsearch ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: la-elasticsearch
    profiles: ["streaming"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Không đặt ES_JAVA_OPTS: để ES tự tính heap (~50% giới hạn RAM container)
      # refresh_interval (1s) và số shard/replica (1/1) là mặc định, đặt khi tạo index
    ports:
      - "9200:9200"
    mem_limit: 1200m
    cpus: 1.5
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 30s
      start_period: 5m
      retries: 10

  # ---------- Spark Standalone cluster: 1 master + 2 workers ----------
  # Master UI: http://localhost:8081; worker UIs: 8082 and 8083.
  # Spark work runs on two worker containers; both share this Docker host's physical CPU/RAM.
  spark-master:
    image: apache/spark:3.5.1
    container_name: la-spark-master
    profiles: ["streaming"]
    environment:
      PYSPARK_PYTHON: python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark-jobs:/opt/spark-jobs
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: la-spark-worker-1
    profiles: ["streaming"]
    environment:
      PYSPARK_PYTHON: python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "640m", "--webui-port", "8081"]
    ports:
      - "8082:8081"
    mem_limit: 1g
    cpus: 0.75
    depends_on:
      spark-master:
        condition: service_started

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: la-spark-worker-2
    profiles: ["streaming"]
    environment:
      PYSPARK_PYTHON: python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "768m", "--webui-port", "8081"]
    ports:
      - "8083:8081"
    mem_limit: 1g
    cpus: 0.75
    depends_on:
      spark-master:
        condition: service_started

  # ---------- Redis (cache, tuỳ chọn, không nằm trong bảng tham số) ----------
  redis:
    image: redis:7-alpine
    container_name: la-redis
    profiles: ["streaming"]
    ports:
      - "6379:6379"
    mem_limit: 128m
    cpus: 0.25

  # ---------- Spring Boot: chung một ứng dụng cho baseline và pipeline ----------
  # Các tham số dùng mặc định, không đặt gì thêm:
  #   - Tomcat threads tối đa = 200
  #   - HikariCP pool = 10 (chỉ baseline)
  #   - Heap JVM = 25% RAM container (~192MB với container 768MB)
  #   - Kafka producer: acks=all, linger.ms=0, batch.size=16384
  app:
    build: ./app
    container_name: la-app
    profiles: ["app"]
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logdb
      SPRING_DATASOURCE_USERNAME: loguser
      SPRING_DATASOURCE_PASSWORD: logpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_ACKS: all
      PIPELINE_KAFKA_TOPIC: logs
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    mem_limit: 768m
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
